<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Four low-fidelity QBR Dashboard wireframes</title>
  <desc id="desc">Neutral wireframes documenting the overview dashboard, category detail, upload data and mobile category view information architecture.</desc>
  <defs>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#222}
      .heading{font:700 17px Arial,sans-serif;fill:#222}
      .label{font:13px Arial,sans-serif;fill:#555;text-anchor:middle}
      .small{font:11px Arial,sans-serif;fill:#555}
      .frame{fill:#fff;stroke:#666;stroke-width:2}
      .block{fill:#f4f4f4;stroke:#999;stroke-width:1.5}
      .dark{fill:#ddd;stroke:#777;stroke-width:1.5}
      .line{fill:none;stroke:#777;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#fff"/>
  <text x="35" y="42" class="title">Low-fidelity design wireframes</text>

  <g transform="translate(35 78)">
    <text x="0" y="0" class="heading">1. Overview Dashboard</text>
    <rect x="0" y="18" width="540" height="300" class="frame"/>
    <rect x="0" y="18" width="105" height="300" class="dark"/>
    <text x="52" y="48" class="label">[Navigation]</text>
    <text x="52" y="76" class="label">Overview</text><text x="52" y="98" class="label">Categories</text><text x="52" y="120" class="label">Upload</text>
    <text x="125" y="48" class="heading">[Page title]</text>
    <rect x="122" y="62" width="118" height="34" class="block"/><text x="181" y="84" class="label">[Date filter]</text>
    <rect x="250" y="62" width="118" height="34" class="block"/><text x="309" y="84" class="label">[Category filter]</text>
    <rect x="378" y="62" width="118" height="34" class="block"/><text x="437" y="84" class="label">[Status filter]</text>
    <rect x="122" y="112" width="86" height="52" class="block"/><text x="165" y="142" class="label">[KPI card]</text>
    <rect x="218" y="112" width="86" height="52" class="block"/><text x="261" y="142" class="label">[KPI card]</text>
    <rect x="314" y="112" width="86" height="52" class="block"/><text x="357" y="142" class="label">[KPI card]</text>
    <rect x="410" y="112" width="86" height="52" class="block"/><text x="453" y="142" class="label">[KPI card]</text>
    <rect x="122" y="180" width="250" height="112" class="block"/><text x="247" y="214" class="label">[Trend chart]</text><polyline points="145,270 195,235 245,250 295,205 345,225" class="line"/>
    <rect x="386" y="180" width="110" height="112" class="block"/><text x="441" y="214" class="label">[RAG chart]</text><circle cx="441" cy="250" r="27" fill="none" stroke="#888" stroke-width="10" stroke-dasharray="45 25"/>
  </g>

  <g transform="translate(625 78)">
    <text x="0" y="0" class="heading">2. Category Detail</text>
    <rect x="0" y="18" width="540" height="300" class="frame"/>
    <rect x="0" y="18" width="105" height="300" class="dark"/>
    <text x="52" y="48" class="label">[Navigation]</text>
    <text x="125" y="48" class="heading">[Category heading]</text>
    <rect x="122" y="62" width="118" height="34" class="block"/><text x="181" y="84" class="label">[Date filter]</text>
    <rect x="250" y="62" width="118" height="34" class="block"/><text x="309" y="84" class="label">[Category filter]</text>
    <rect x="378" y="62" width="118" height="34" class="block"/><text x="437" y="84" class="label">[Status filter]</text>
    <rect x="122" y="112" width="86" height="48" class="block"/><text x="165" y="140" class="label">[KPI card]</text>
    <rect x="218" y="112" width="86" height="48" class="block"/><text x="261" y="140" class="label">[KPI card]</text>
    <rect x="314" y="112" width="86" height="48" class="block"/><text x="357" y="140" class="label">[KPI card]</text>
    <rect x="410" y="112" width="86" height="48" class="block"/><text x="453" y="140" class="label">[KPI card]</text>
    <rect x="122" y="176" width="250" height="72" class="block"/><text x="247" y="206" class="label">[Metric trend]</text><polyline points="145,232 195,210 245,224 295,198 345,215" class="line"/>
    <rect x="386" y="176" width="110" height="72" class="block"/><text x="441" y="206" class="label">[RAG distribution]</text>
    <rect x="122" y="262" width="374" height="34" class="block"/><text x="309" y="284" class="label">[Latest values / detailed records]</text>
  </g>

  <g transform="translate(35 438)">
    <text x="0" y="0" class="heading">3. Upload Data</text>
    <rect x="0" y="18" width="700" height="300" class="frame"/>
    <rect x="0" y="18" width="105" height="300" class="dark"/>
    <text x="52" y="48" class="label">[Navigation]</text>
    <text x="125" y="48" class="heading">[Upload Data]</text>
    <rect x="510" y="38" width="150" height="36" class="block"/><text x="585" y="61" class="label">[Replace / Append]</text>
    <rect x="125" y="92" width="245" height="78" class="block"/><text x="247" y="124" class="label">[Category upload area]</text><text x="247" y="148" class="label">[Drop file / Browse]</text>
    <rect x="390" y="92" width="245" height="78" class="block"/><text x="512" y="124" class="label">[Category upload area]</text><text x="512" y="148" class="label">[Drop file / Browse]</text>
    <rect x="125" y="188" width="510" height="58" class="block"/><text x="380" y="215" class="label">[Validation / error feedback]</text><text x="380" y="235" class="label">[Row number and correction reason]</text>
    <rect x="125" y="262" width="180" height="34" class="block"/><text x="215" y="284" class="label">[Template control]</text>
    <rect x="320" y="262" width="180" height="34" class="block"/><text x="410" y="284" class="label">[Template control]</text>
  </g>

  <g transform="translate(805 438)">
    <text x="0" y="0" class="heading">4. Mobile Category View</text>
    <rect x="85" y="18" width="245" height="300" class="frame"/>
    <rect x="85" y="18" width="245" height="42" class="dark"/>
    <text x="103" y="44" class="small">[☰]</text><text x="207" y="44" class="label">[Category heading]</text>
    <rect x="102" y="76" width="211" height="30" class="block"/><text x="207" y="96" class="label">[Date filter]</text>
    <rect x="102" y="114" width="211" height="30" class="block"/><text x="207" y="134" class="label">[Category filter]</text>
    <rect x="102" y="152" width="211" height="30" class="block"/><text x="207" y="172" class="label">[Status filter]</text>
    <rect x="102" y="194" width="211" height="36" class="block"/><text x="207" y="217" class="label">[KPI card]</text>
    <rect x="102" y="238" width="211" height="36" class="block"/><text x="207" y="261" class="label">[KPI card]</text>
    <rect x="102" y="282" width="211" height="24" class="block"/><text x="207" y="299" class="label">[Chart / content reflow]</text>
  </g>
</svg>